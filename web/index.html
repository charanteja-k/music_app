<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DilSe: Stream high-quality music with pure emotion. Suno Dil Se.">

  <!-- Google Sign-In Client ID -->
  <meta name="google-signin-client_id" content="130201428767-i1tt2et39of41d7mfs4j3d7fmnab5ug4.apps.googleusercontent.com">

  <!-- Mobile meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DilSe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#000000">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DilSe - Suno Dil Se</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-oled: #000000;
      --ruby-brand: #FA2D48;
      --ruby-glow: rgba(250, 45, 72, 0.45);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      background-color: var(--bg-oled);
      color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Sovereign Failsafe Shell: 100% Decoupled from Flutter Engine */
    #dilse-engine-fallback {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000000;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.25s ease-out;
      pointer-events: none; /* CRITICAL: Never block touches from reaching Flutter */
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
    }
    #dilse-engine-fallback.dismissed {
      opacity: 0;
      pointer-events: none;
      display: none !important;
    }

    @keyframes dilsePulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 24px var(--ruby-glow); }
      50% { transform: scale(1.06); box-shadow: 0 0 44px rgba(250, 45, 72, 0.7); }
      100% { transform: scale(1); box-shadow: 0 0 24px var(--ruby-glow); }
    }

    /* Centered Splash Hero */
    .dilse-splash-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }
    .dilse-logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF4B63 0%, #FA2D48 60%, #B8001F 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: dilsePulseGlow 2.2s infinite ease-in-out;
      margin-bottom: 14px;
      cursor: pointer;
      pointer-events: auto;
    }
    .dilse-logo-badge svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }
    .dilse-splash-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin: 0;
      background: linear-gradient(180deg, #FFFFFF 30%, #FF758C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      pointer-events: auto;
    }
    .dilse-splash-tagline {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2.4px;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* Offline Connectivity Pill */
    .dilse-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.75);
    }
    .dilse-status-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1DB954;
    }
    .dilse-status-pill.offline .dot {
      background: #FF9F0A;
    }

    /* Sovereign Failsafe Card (Only shown if engine watchdog fires) */
    #dilse-offline-failsafe-card {
      display: none;
      margin-top: 24px;
      padding: 14px 18px;
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      text-align: center;
      max-width: 320px;
      pointer-events: auto; /* Active for recovery buttons */
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }
    .failsafe-btn {
      background: #242424;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      margin: 4px;
      cursor: pointer;
    }
    .failsafe-btn.primary {
      background: #FA2D48;
      border-color: #FA2D48;
    }
  </style>
</head>
<body>
  <!-- DilSe Engine-Independent Offline App Shell (Zero-Black-Screen) -->
  <div id="dilse-engine-fallback">
    <div class="dilse-splash-hero">
      <div class="dilse-logo-badge" onclick="handleLogoTap()">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <h1 class="dilse-splash-title" onclick="handleLogoTap()">DilSe</h1>
      <span class="dilse-splash-tagline">Suno Dil Se.</span>
      <div id="dilse-net-pill" class="dilse-status-pill">
        <span class="dot"></span>
        <span id="dilse-net-text">Initializing Library</span>
      </div>
    </div>

    <!-- Engine-Independent Failsafe Recovery Card (Revealed if Flutter takes >3.8s) -->
    <div id="dilse-offline-failsafe-card">
      <div style="font-size: 13.5px; font-weight: 700; margin-bottom: 4px; color: #ffffff;">Startup Watchdog Active</div>
      <div style="font-size: 11.5px; color: rgba(255,255,255,0.65); margin-bottom: 12px; line-height: 1.4;">
        If startup is taking longer than expected, reload or reset the offline cache.
      </div>
      <div style="display: flex; justify-content: center; gap: 8px;">
        <button class="failsafe-btn primary" onclick="location.reload()">Reload</button>
        <button class="failsafe-btn" onclick="clearDilSeCache()">Reset Cache</button>
      </div>
    </div>
  </div>

  <script>
    // Offline status detection
    function updateOnlineStatus() {
      var pill = document.getElementById('dilse-net-pill');
      var text = document.getElementById('dilse-net-text');
      if (!pill || !text) return;
      if (navigator.onLine) {
        pill.classList.remove('offline');
        text.innerText = 'Initializing Library';
      } else {
        pill.classList.add('offline');
        text.innerText = 'Offline Mode (Saved Music Ready)';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // Sovereign Engine Watchdog (3.8 seconds):
    var dilseWatchdog = setTimeout(function () {
      var card = document.getElementById('dilse-offline-failsafe-card');
      if (card) {
        card.style.display = 'block';
      }
    }, 3800);

    // Global hook to dismiss the fallback shell smoothly
    window.dismissDilSeFallback = function () {
      clearTimeout(dilseWatchdog);
      var fallback = document.getElementById('dilse-engine-fallback');
      if (fallback) {
        fallback.classList.add('dismissed');
        setTimeout(function () {
          fallback.remove();
        }, 260);
      }
    };

    // Watch for Flutter view attachment
    var observer = new MutationObserver(function (mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        observer.disconnect();
        window.dismissDilSeFallback();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Triple-tap emergency gesture on Logo/Title
    var logoTapCount = 0;
    var logoTapTimer = null;
    function handleLogoTap() {
      logoTapCount++;
      clearTimeout(logoTapTimer);
      logoTapTimer = setTimeout(function () { logoTapCount = 0; }, 1800);
      if (logoTapCount >= 3) {
        var card = document.getElementById('dilse-offline-failsafe-card');
        if (card) card.style.display = 'block';
      }
    }

    function clearDilSeCache() {
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).then(function () {
          location.reload(true);
        });
      } else {
        location.reload();
      }
    }
  </script>

  <!-- DilSe Audio Engine (Method 1: Invisible YouTube Player + MediaSession) -->
  <script src="https://www.youtube.com/iframe_api" async defer onerror="console.warn('[DilSe] YouTube IFrame offline')"></script>
  <script src="dilse_web_player.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.update();
          console.log('[DilSe ServiceWorker] Registered successfully (scope: ' + reg.scope + ')');
        }).catch(function (err) {
          console.warn('[DilSe ServiceWorker] Registration failed:', err);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
